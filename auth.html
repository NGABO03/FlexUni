{% extends "base.html" %}{% block content %}<div class="auth"><div><div class="eyebrow">FLEXUNI</div><h1>{{"Create your account" if mode=="register" else "Welcome back"}}</h1><p>{{"Join your digital campus." if mode=="register" else "Continue where you left off."}}</p></div><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}">{% if mode=="register" %}
<label>University<select name="university_id" required>{% for u in universities %}<option value="{{u.id}}">{{u.name}}</option>{% endfor %}</select></label><input name="name" placeholder="Full name" required><input name="course" placeholder="Course / program"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (8+ characters)" required><button class="cta">Create account</button>{% else %}<input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="cta">Log in</button>{% endif %}</form></div>{% endblock %}
