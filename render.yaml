services:
  - type: web
    name: flexuni-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gevent --workers 2 --timeout 60 app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flexuni-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: AUTO_CREATE_DB
        value: "0"
      - key: REDIS_URL
        sync: false
      - key: REDIS_REQUIRED
        value: "0"
      - key: MEDIA_STORAGE
        value: local
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: RTC_ICE_SERVERS_JSON
        value: '[{"urls":["stun:stun.l.google.com:19302"]}]'
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false

databases:
  - name: flexuni-db
    databaseName: flexuni
    user: flexuni
    plan: free

# Enable this service if your Render workspace supports Key Value in Blueprints.
# If Render rejects the free plan, create Key Value manually and copy its URL to REDIS_URL.
  
