services:
  web:
    build: .
    environment:
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://flexuni:${POSTGRES_PASSWORD}@db:5432/flexuni
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "1"
      COOKIE_SECURE: "0"
      AUTO_CREATE_DB: "1"
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-flexuni}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: flexuni
      POSTGRES_USER: flexuni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flexuni-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexuni -d flexuni"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
