{% extends "base.html" %}{% block content %}<div class="page-title"><div class="eyebrow">CONNECT</div><h1>Campus communities</h1><p>Find people who share your interests.</p></div><div class="cards">{% for x in communities %}{% set c=x.obj %}<div class="community"><div class="community-icon">◈</div><h2>{{c.name}}</h2><p>{{c.description}}</p><small>{{x.members}} members</small>{% if current_user %}<form method="post" action="{{url_for('join',cid=c.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button>{{"Joined ✓" if x.joined else "Join community"}}</button></form>{% else %}<a class="smallbtn" href="{{url_for('login')}}">Log in to join</a>{% endif %}</div>{% endfor %}</div>{% endblock %}
